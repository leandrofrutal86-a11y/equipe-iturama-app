name: Gerar APK Equipe Iturama

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          unzip -q equipe_iturama_app_v2-1.zip
          echo "Procurando gradlew..."
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado!"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager --licenses <<< "y" || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Dar permissão ao Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: equipe-iturama-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
